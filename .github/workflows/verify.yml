name: Foundation verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Browser QA
        run: |
          node scripts/serve.mjs --dist > /tmp/geopolymer-server.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://localhost:4173/ > /dev/null && break; sleep 1; done
          node tests/browser-smoke.cjs
          node tests/notebook-browser.cjs
          node tests/literature-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: .qa/
          include-hidden-files: true
